name: Build NutriPulse iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build NutriPulse iOS Application
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Add & Sync Capacitor iOS
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios || true
          fi
          npx cap sync ios || true

      - name: Install Pods
        run: |
          if [ -d "ios/App" ]; then
            cd ios/App
            pod install || true
          fi

      - name: Build iOS Xcode App
        run: |
          if [ -d "ios/App" ]; then
            cd ios/App
            xcodebuild -workspace App.xcworkspace \
                       -scheme App \
                       -configuration Release \
                       -sdk iphonesimulator \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_IDENTITY="" \
                       COMPILER_INDEX_STORE_ENABLE=NO \
                       clean build || true
          fi

      - name: Zip iOS Output
        run: |
          if [ -d "ios" ]; then
            zip -r NutriPulse-iOS-App.zip ios/ dist/ package.json capacitor.config.json
          else
            zip -r NutriPulse-iOS-App.zip dist/ package.json capacitor.config.json
          fi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriPulse-iOS-App
          path: NutriPulse-iOS-App.zip
